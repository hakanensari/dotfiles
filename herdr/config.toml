onboarding = false

[ui]
prompt_new_tab_name = false

# Agents sidebar: show each pane's terminal title as its own row.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", fg = "#6c7086", dim = false }],
  ["agent"],
]

# Background notification popup delivery
[ui.toast]
delivery = "system"
delay_seconds = 1

# Play sounds when agents change state in background workspaces
[ui.sound]
enabled = true

[keys]
new_workspace = ["prefix+shift+n", "cmd+n"]
new_tab = ["prefix+c", "cmd+t"]
close_tab = ["prefix+shift+x", "cmd+w"]
switch_tab = ["prefix+1..9", "cmd+1..9"]
