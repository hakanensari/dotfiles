onboarding = false

[ui]
prompt_new_tab_name = false

# Agents sidebar: show each Claude pane's terminal title (Claude Code's session
# title — set per-worktree by .claude/bin/session-title.sh in pulsify, and the
# auto-generated topic elsewhere) as its own row.
# Swap to [["state_icon", "workspace", "terminal_title_stripped"], ["agent"]]
# for a two-row layout if the extra row costs too much vertical space.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]
