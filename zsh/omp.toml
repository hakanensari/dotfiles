version = 3
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }}'

[upgrade]
source = 'cdn'
interval = '168h'
auto = false
notice = false

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
type = 'path'
style = 'plain'
foreground = 'cyan'
template = '{{ .Path }} '

[blocks.segments.properties]
style = 'folder'

[[blocks.segments]]
type = 'git'
style = 'plain'
foreground = 'magenta'
template = '{{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} '

[blocks.segments.properties]
branch_icon = ''

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'green'
template = '❯ '
